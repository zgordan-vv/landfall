name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust format, lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pinned Rust toolchain
        run: |
          expected="$(sed -nE 's/^channel = "([0-9.]+)"$/\1/p' rust-toolchain.toml)"
          actual="$(rustc --version | awk '{print $2}')"
          test "$actual" = "$expected"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Enforce crate dependency direction
        run: bash scripts/check-rust-dependency-direction.sh

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Build all Rust targets
        run: cargo build --workspace --all-targets --all-features --locked

  typescript:
    name: TypeScript lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Verify JavaScript toolchain pins
        run: |
          expected_node="v$(tr -d '[:space:]' < .node-version)"
          expected_pnpm="$(node --input-type=module -e 'import manifest from "./package.json" with { type: "json" }; process.stdout.write(manifest.engines.pnpm);')"
          test "$(node --version)" = "$expected_node"
          test "$(pnpm --version)" = "$expected_pnpm"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Run lint checks
        run: pnpm run lint

      - name: Type-check workspace
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Build packages and dashboard
        run: pnpm run build

  postgres:
    name: PostgreSQL integration foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start pinned PostgreSQL
        run: bash scripts/compose.sh up --detach --wait postgres

      - name: Verify PostgreSQL runtime invariants
        run: bash scripts/check-postgres-compose.sh

      - name: Remove CI database resources
        if: always()
        run: bash scripts/compose.sh down --volumes --remove-orphans

  contracts:
    name: Schema and OpenAPI drift
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify generated-contract registration
        run: bash scripts/check-contract-drift.sh

  security:
    name: Dependencies, licenses, secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Rust advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1, cargo-deny 0.20.2
        with:
          command: check
          arguments: --all-features
          command-arguments: advisories bans licenses sources
          rust-version: 1.98.0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Node.js dependencies
        run: pnpm audit --audit-level high

      - name: Enforce Node.js dependency licenses
        run: node scripts/check-node-licenses.mjs

      - name: Scan complete Git history for secrets
        run: bash scripts/check-secrets.sh

  container:
    name: Build server container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build local server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: landfall-server:ci

      - name: Verify container metadata
        run: bash scripts/check-server-image.sh landfall-server:ci
