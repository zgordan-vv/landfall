name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version, for example v0.1.1-rc.1
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run application test suites
        run: |
          cargo test --workspace --all-targets --all-features --locked
          pnpm run test

      - name: Run release security and contract gates
        run: |
          bash scripts/release-security-gate.sh
          bash scripts/check-contract-drift.sh
          bash scripts/check-monitoring-config.sh
          bash scripts/test-backup-restore.sh

  publish:
    name: Publish immutable image and release archive
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c36752b8dc92d9b6d79ef3d0 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: metadata
        uses: docker/metadata-action@ff4198d0a0fc24b4f47fbcfbfe6e4a37274cf030 # v5.8.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/landfall
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-

      - name: Build and publish server image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=landfall-release
          cache-to: type=gha,mode=max,scope=landfall-release,ignore-error=true

      - name: Create source archive and checksum
        env:
          LANDFALL_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          LANDFALL_RELEASE_IMAGE: ghcr.io/${{ github.repository_owner }}/landfall@${{ steps.build.outputs.digest }}
        run: ./scripts/create-release-archive.sh

      - name: Attest the published image
        uses: actions/attest-build-provenance@977bb2d0bf00d6d8a3437f42e1ceeb2eaf7a4ed5 # v3.0.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/landfall
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@da05d552573ad87ebf9572a2948b25bf5ef9a1b9 # v2.3.2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/release/*.tar.gz
            dist/release/*.sha256
            dist/release/*.provenance

      - name: Export immutable deployment reference
        id: image
        run: echo "reference=ghcr.io/${{ github.repository_owner }}/landfall@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  staging:
    name: Staging sign-off
    needs: publish
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Record immutable image for staging operator
        run: |
          echo "Deploy and smoke-test this exact digest on staging before approving this environment:"
          echo "${{ needs.publish.outputs.image }}"

  production:
    name: Production approval
    needs: [publish, staging]
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - name: Record immutable production candidate
        run: |
          echo "Approved production candidate: ${{ needs.publish.outputs.image }}"
          echo "Run scripts/deploy-release.sh on the production host after staging sign-off."
