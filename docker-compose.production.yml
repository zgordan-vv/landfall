# Production overlay. Start it with the production profile; do not use this
# file with the repository's development .env.example.
services:
  # Prevent the development database service from being started by a
  # production invocation of Compose.
  postgres:
    profiles: [development]

  server:
    # A production host must pull the release image, never build from its
    # checkout during deployment.
    build: !reset null
    image: ${LANDFALL_SERVER_IMAGE:?LANDFALL_SERVER_IMAGE must be an immutable registry image digest}
    environment:
      DATABASE_URL:
      DATABASE_URL_FILE: /run/secrets/database_url
      LANDFALL_BOOTSTRAP_TOKEN:
      LANDFALL_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
    depends_on: !override
      postgres-production:
        condition: service_healthy
    secrets:
      - database_url
      - bootstrap_token
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    # nginx on the host reaches this loopback-only listener. It is never
    # directly reachable from the network.
    ports: !override
      - "127.0.0.1:8080:8080"

  observer-worker:
    image: ${LANDFALL_SERVER_IMAGE:?LANDFALL_SERVER_IMAGE must be an immutable registry image digest}
    environment:
      DATABASE_URL:
      DATABASE_URL_FILE: /run/secrets/database_url
    depends_on: !override
      postgres-production:
        condition: service_healthy
    secrets:
      - database_url
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m

secrets:
  database_url:
    file: ${LANDFALL_DATABASE_URL_FILE:?LANDFALL_DATABASE_URL_FILE is required}
  bootstrap_token:
    file: ${LANDFALL_BOOTSTRAP_TOKEN_SECRET_FILE:?LANDFALL_BOOTSTRAP_TOKEN_SECRET_FILE is required}
