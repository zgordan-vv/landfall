services:
  postgres-source:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_DB: backup_e2e
      POSTGRES_USER: backup_e2e
      POSTGRES_PASSWORD: backup_e2e_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=backup_e2e --dbname=backup_e2e"]
      interval: 1s
      timeout: 3s
      retries: 20

  postgres-restore:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_DB: backup_e2e
      POSTGRES_USER: backup_e2e
      POSTGRES_PASSWORD: backup_e2e_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=backup_e2e --dbname=backup_e2e"]
      interval: 1s
      timeout: 3s
      retries: 20
