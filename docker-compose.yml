name: landfall

x-postgres-common: &postgres-common
  image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
  restart: unless-stopped
  environment:
    POSTGRES_DB: ${LANDFALL_POSTGRES_DB:?LANDFALL_POSTGRES_DB is required}
    POSTGRES_USER: ${LANDFALL_POSTGRES_USER:?LANDFALL_POSTGRES_USER is required}
    POSTGRES_PASSWORD: ${LANDFALL_POSTGRES_PASSWORD:?LANDFALL_POSTGRES_PASSWORD is required}
    POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8 --locale=C.UTF-8
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        pg_isready
        --host=127.0.0.1
        --port=5432
        --username="$${POSTGRES_USER}"
        --dbname="$${POSTGRES_DB}"
    interval: 2s
    timeout: 5s
    retries: 15
    start_period: 5s
  shm_size: 256mb
  stop_grace_period: 30s
  networks:
    - data
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    <<: *postgres-common
    volumes:
      - postgres-data:/var/lib/postgresql

  postgres-demo:
    <<: *postgres-common
    profiles: [demo]
    volumes:
      - postgres-demo-data:/var/lib/postgresql

  postgres-production:
    <<: *postgres-common
    profiles: [production]
    volumes:
      - postgres-production-data:/var/lib/postgresql

volumes:
  postgres-data:
  postgres-demo-data:
  postgres-production-data:

networks:
  data:
    internal: true
