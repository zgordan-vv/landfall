name: landfall

x-postgres-common: &postgres-common
  image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
  restart: unless-stopped
  environment:
    POSTGRES_DB: ${LANDFALL_POSTGRES_DB:?LANDFALL_POSTGRES_DB is required}
    POSTGRES_USER: ${LANDFALL_POSTGRES_USER:?LANDFALL_POSTGRES_USER is required}
    POSTGRES_PASSWORD: ${LANDFALL_POSTGRES_PASSWORD:?LANDFALL_POSTGRES_PASSWORD is required}
    POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8 --locale=C.UTF-8
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        pg_isready
        --host=127.0.0.1
        --port=5432
        --username="$${POSTGRES_USER}"
        --dbname="$${POSTGRES_DB}"
    interval: 2s
    timeout: 5s
    retries: 15
    start_period: 5s
  shm_size: 256mb
  stop_grace_period: 30s
  networks:
    - data
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${LANDFALL_SERVER_IMAGE:-landfall-server:local}
    environment:
      DATABASE_URL: postgres://${LANDFALL_POSTGRES_USER}:${LANDFALL_POSTGRES_PASSWORD}@postgres:5432/${LANDFALL_POSTGRES_DB}
      LANDFALL_BIND: 0.0.0.0:8080
      LANDFALL_BOOTSTRAP_TOKEN: ${LANDFALL_BOOTSTRAP_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - data
      - egress
    restart: unless-stopped
    stop_grace_period: 30s

  observer-worker:
    image: ${LANDFALL_SERVER_IMAGE:-landfall-server:local}
    command: ["worker"]
    environment:
      DATABASE_URL: postgres://${LANDFALL_POSTGRES_USER}:${LANDFALL_POSTGRES_PASSWORD}@postgres:5432/${LANDFALL_POSTGRES_DB}
      LANDFALL_OBSERVER_CONCURRENCY: ${LANDFALL_OBSERVER_CONCURRENCY:-4}
      LANDFALL_OBSERVER_POLL_INTERVAL_MS: ${LANDFALL_OBSERVER_POLL_INTERVAL_MS:-500}
      LANDFALL_OBSERVER_RETRY_DELAY_SECONDS: ${LANDFALL_OBSERVER_RETRY_DELAY_SECONDS:-5}
      LANDFALL_OBSERVER_LEASE_SECONDS: ${LANDFALL_OBSERVER_LEASE_SECONDS:-60}
      LANDFALL_OBSERVER_RECOVERY_INTERVAL_SECONDS: ${LANDFALL_OBSERVER_RECOVERY_INTERVAL_SECONDS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
      - egress
    restart: unless-stopped
    stop_grace_period: 30s

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/monitoring:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      server:
        condition: service_started
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - data
      - monitoring
    restart: unless-stopped
    stop_grace_period: 30s

  postgres:
    <<: *postgres-common
    volumes:
      - postgres-data:/var/lib/postgresql

  postgres-demo:
    <<: *postgres-common
    profiles: [demo]
    volumes:
      - postgres-demo-data:/var/lib/postgresql

  postgres-production:
    <<: *postgres-common
    profiles: [production]
    volumes:
      - postgres-production-data:/var/lib/postgresql

volumes:
  postgres-data:
  postgres-demo-data:
  postgres-production-data:
  prometheus-data:

networks:
  data:
    internal: true
  egress:
  monitoring:
