name: landfall

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LANDFALL_POSTGRES_DB:?LANDFALL_POSTGRES_DB is required}
      POSTGRES_USER: ${LANDFALL_POSTGRES_USER:?LANDFALL_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${LANDFALL_POSTGRES_PASSWORD:?LANDFALL_POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8 --locale=C.UTF-8
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          --host=127.0.0.1
          --port=5432
          --username="$${POSTGRES_USER}"
          --dbname="$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    shm_size: 256mb
    stop_grace_period: 30s
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres-data:

networks:
  data:
    internal: true
