[package]
name = "report-renderer-storage-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
askama = { version = "0.16.0", default-features = false, features = ["derive", "std"] }
flate2 = "1.1"
minijinja = { version = "2.24.0", default-features = false, features = ["builtins", "multi_template", "serde", "speedups"] }
postgres = "0.19.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
lto = "thin"
